# Runs as the unprivileged nginx user, hence port 8080.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /usr/share/nginx/html;

    location = /health/live {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /health/ready {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri /index.html;
        # webpack emits fixed file names (main.js, remoteEntry.js, numbered
        # chunks), so nothing can be cached blindly: clients must revalidate.
        add_header Cache-Control 'no-cache';
    }

    # index.html must never be cached.
    location = /index.html {
        add_header Cache-Control 'no-store, no-cache';
        etag off;
        if_modified_since off;
        expires off;
    }
}
